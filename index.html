<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121521">
  <meta name="description" content="Run and share checked Kurt proofs directly in your browser.">
  <title>Kurt Playground</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="logo">K</span><span class="title">Kurt Playground</span><span id="version" class="version">Kurt loading…</span></div>
    <div id="status" class="status" role="status">Loading runtime…</div>
  </header>
  <main class="layout">
    <section class="panel editor-panel">
      <div class="toolbar">
        <button id="runBtn" class="btn primary" disabled title="Cmd/Ctrl + Enter">Run</button>
        <button id="cancelBtn" class="btn danger hidden">Cancel</button>
        <button id="loadBtn" class="btn small">Upload</button>
        <button id="saveBtn" class="btn small">Download</button>
        <button id="shareBtn" class="btn small">Share</button>
        <div id="examplesContainer" class="examples"></div>
        <div class="spacer"></div>
        <a class="link" href="https://github.com/harmeling/kurt-lang" target="_blank" rel="noreferrer noopener">kurt-lang</a>
      </div>
      <div id="symbolBar" class="symbol-bar" aria-label="Insert mathematical symbol"></div>
      <div class="editor-wrap">
        <pre id="editorHighlight" class="editor-highlight" aria-hidden="true"></pre>
        <textarea id="editor" spellcheck="false" aria-label="Kurt proof editor" wrap="off"></textarea>
      </div>
    </section>
    <section class="panel output-panel hidden" id="outputPanel" aria-live="polite">
      <div class="panel-header"><span>Output</span><div class="actions">
        <div class="indent-wrapper"><button id="indentBtn" class="btn small">Indent: <span id="indentLabel">40</span></button><div id="indentPopover" class="popover hidden"><input id="indentSlider" type="range" min="20" max="120" step="2" value="40"></div></div>
        <button id="certificateBtn" class="btn small" disabled>Certificate</button>
        <button id="outputDownloadBtn" class="btn small">Download output</button>
        <button id="copyBtn" class="btn small">Copy</button>
        <button id="clearBtn" class="btn small">Clear</button>
      </div></div>
      <pre id="output" class="output" tabindex="0"></pre>
    </section>
  </main>
  <footer class="app-footer">Cmd/Ctrl+Enter checks · Cmd/Ctrl +/−/0 changes text size · drafts stay in this browser</footer>
</body>
</html>
